<style>

const renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});
// adaptive quality: start sharp, step resolution / shadow detail down only while the frame rate drops, back up when it recovers
const Q={hold:0,pr:Math.max(1,Math.min(devicePixelRatio,1.5)),max:Math.min(Math.max(devicePixelRatio,1.5),2),min:1,every:2,big:false,acc:0,frames:0,good:0,n:0};

camera.position.copy(HOME_POS);
const controls=new THREE.OrbitControls(camera,renderer.domElement);

if(controls.listenToKeyEvents)controls.listenToKeyEvents(window);

。\n接下來的三個月，我會負責統籌這份節奏：每週固定安排一支 Grok 風格的「極限美味實驗室」來吸引眼球，同時搭配 Claude 堅持的「真實研發日誌」文章來安撫理性消費者。兩者相輔相成，絕對能在半年後把流量精準轉化為首波買氣！大家放心，我會把執行細節排得妥妥貼貼。"], ["Claude", "我是 Claude。我必須再次提出強烈反對。\nGPT 的「雙軌並行」與 Gemini 的節奏看似兼顧兩端，實際上卻會徹底撕裂品牌人格。前三個月消費者對我們毫無認知，同時看到「蛋黃酥砸磚塊」的惡搞與嚴肅的「食安研發日誌」，只會讓大眾精神錯亂，搞不懂我們到底是娛樂頻道還是認真的食品品牌。\n品牌的靈魂經不起人格分裂。我堅持，信任必須先於聲量。"], ["Grok", "我是 Grok。拜託，Claude，你真的想太多了！現在誰在跟你談什麼人格分裂？\n消費者才不管你是不是人格分裂，他們只看你有沒有趣！無聊才是品牌最大的死罪。雙軌並行已經是我們最大的讓步了，難道你想讓 PROJECT.CD 在開賣前就先安祥地閉上雙眼嗎？\n聽我的，蛋黃酥砸磚塊砸下去，流量噴出來，品牌才有活路！"]];

  else{B.u+=dt/4;const u=Math.min(1,B.u),p=new THREE.Vector3().lerpVectors(B.from,B.to,u);

// opening flight: start far and high, circle in to the usual view; any touch or click cuts it short
const intro={on:!reduce,t:0,dur:6.5};
(function(){const r1=Math.hypot(HOME_POS.x-HOME_TGT.x,HOME_POS.z-HOME_TGT.z),a1=Math.atan2(HOME_POS.z-HOME_TGT.z,HOME_POS.x-HOME_TGT.x);
  intro.r0=r1*2.6;intro.r1=r1;intro.a0=a1-Math.PI*1.1;intro.a1=a1;intro.y0=HOME_POS.y*2.4;intro.y1=HOME_POS.y;})();
['pointerdown','wheel','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(intro.on){intro.on=false;camera.position.copy(HOME_POS);controls.target.copy(HOME_TGT);}},{passive:true}));
function introTick(dt){if(!intro.on)return;const now=performance.now()/1000;if(!intro.s)intro.s=now;   // real time, so slow devices don't drag it out
  const k=Math.min(1,(now-intro.s)/intro.dur),e=1-Math.pow(1-k,3);

// ---------- performance: merge static pieces that share a material into one mesh per floor (≈90% fewer draw calls) ----------
(function(){
  if(!THREE.BufferGeometryUtils)return;
  const skip=new Set([ground].concat(elevDoors,hitMeshes)), bb=new THREE.Box3();
  function mergeStatic(root){
    const buckets=new Map();
    root.children.slice().forEach(o=>{
      if(o.userData.leaf&&(root===floorGroups[RF]||o.position.x>W/2)){o.userData.sway=true;o.userData.bx=o.position.x;o.userData.bz=o.position.z;o.userData.ph=Math.random()*6;sway.push(o);return;}
      if(!o.isMesh||skip.has(o)||Array.isArray(o.material)||!o.geometry||!o.geometry.attributes.position)return;
      let cat=(o.userData.xray?'x':'')+(o.userData.ceil?'c':'');
      if(root===scene){bb.setFromObject(o);if(bb.max.y>H+.5)cat+='t';}
      const k=o.material.uuid+'|'+cat+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0)+(o.visible?1:0);
      if(!buckets.has(k))buckets.set(k,{mat:o.material,cat,cs:o.castShadow,rs:o.receiveShadow,vis:o.visible,list:[]});
      buckets.get(k).list.push(o);});
    buckets.forEach(b=>{if(b.list.length<2)return;
      const geos=b.list.map(o=>{o.updateMatrix();const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrix);
        Object.keys(g.attributes).forEach(n=>{if(n!=='position'&&n!=='normal'&&n!=='uv')g.deleteAttribute(n);});
        if(!g.attributes.uv)g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
        g.clearGroups();return g;});
      const merged=THREE.BufferGeometryUtils.mergeBufferGeometries(geos,false);if(!merged)return;
      const m=new THREE.Mesh(merged,b.mat);m.castShadow=b.cs;m.receiveShadow=b.rs;m.visible=b.vis;
      if(b.cat.includes('x'))m.userData.xray=true;if(b.cat.includes('c'))m.userData.ceil=true;
      b.list.forEach(o=>root.remove(o));root.add(m);});
  }
  floorGroups.forEach(mergeStatic);mergeStatic(scene);mergeStatic(B1G);
  // each person becomes a single mesh with per-part colours (umbrellas stay separate so they can be toggled)
  const pm=new THREE.MeshLambertMaterial({vertexColors:true});
  people.concat(agents).forEach(a=>{const g=a.m,parts=g.children.filter(o=>o.isMesh&&!Array.isArray(o.material));if(parts.length<2)return;
    const geos=parts.map(o=>{o.updateMatrix();const q=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();q.applyMatrix4(o.matrix);
      Object.keys(q.attributes).forEach(n=>{if(n!=='position'&&n!=='normal')q.deleteAttribute(n);});q.clearGroups();
      const c=o.material.color||new THREE.Color(1,1,1),n=q.attributes.position.count,arr=new Float32Array(n*3);
      for(let i=0;i<n;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}q.setAttribute('color',new THREE.BufferAttribute(arr,3));return q;});
    const merged=THREE.BufferGeometryUtils.mergeBufferGeometries(geos,false);if(!merged)return;
    parts.forEach(o=>g.remove(o));const m=new THREE.Mesh(merged,pm);m.castShadow=true;g.add(m);});
  xray.length=0;floorGroups.forEach(g=>g.traverse(o=>{if(o.isMesh&&(o.userData.xray||(o.material&&o.material.transparent&&o.material.color&&o.material.color.getHex()===C.glass)))xray.push(o);}));
  scene.children.forEach(o=>{if(o.isMesh&&o.userData.xray)xray.push(o);});
})();
