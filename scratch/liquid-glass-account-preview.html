<title>Glass Account Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root {
    --ink: #16161a;
    --stage-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  /* 跟正式站上 .modal-container 同一招：可以捲動但不露出捲軸本身，
     捲軸壓在畫面邊緣會讓整頁看起來不乾淨 */
  html {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  html::-webkit-scrollbar {
    display: none;
  }

  body {
    margin: 0;
    background: var(--stage-bg);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 情境背景：白底 + 淡色模糊色塊——玻璃邊緣、模糊層次要靠這些色塊才看得出來，
     純白底什麼都沒有的話，玻璃跟背景會糊成同一片，看不出「這是透明的」 ===== */
  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px;
    overflow: hidden;
    isolation: isolate;
  }

  /* 拿掉彩色模糊色塊，改成純白＋一點點灰階層次（不是色彩，是明暗）——
     玻璃的透明感改靠邊框高光、陰影跟卡片本身的白色濃淡差異表現，不靠背景色 */
  .stage::before {
    content: '';
    position: absolute;
    inset: -20%;
    z-index: -1;
    background:
      radial-gradient(50% 55% at 30% 20%, rgba(22, 22, 26, 0.05), transparent 70%),
      radial-gradient(55% 60% at 75% 85%, rgba(22, 22, 26, 0.04), transparent 70%),
      linear-gradient(160deg, #ffffff, #f0f0f2 60%);
    filter: blur(60px);
  }

  .tag {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(22, 22, 26, 0.5);
    z-index: 5;
  }

  /* ===== 液態玻璃版彈窗容器（白底版）：白色背景上，玻璃改成淺色調＋深色高光反過來——
     邊框跟陰影都改用 ink（黑），亮面留給白色本身，暗面才用陰影表現「浮在背景上」 ===== */
  .glass-modal {
    position: relative;
    width: 100%;
    max-width: 1100px;
    border-radius: 32px;
    padding: 44px 40px 32px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.8),
      inset 0 0 40px rgba(255, 255, 255, 0.15),
      0 30px 60px -24px rgba(22, 22, 26, 0.28);
  }

  .glass-close {
    position: absolute;
    top: 8px;
    right: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    font-size: 22px;
    color: rgba(22, 22, 26, 0.6);
    cursor: pointer;
  }

  .columns {
    display: grid;
    grid-template-columns: 1.15fr 0.8fr 1.05fr;
    gap: 24px;
    text-align: left;
  }

  @media (max-width: 820px) {
    .columns { grid-template-columns: 1fr; }
  }

  /* 每欄本身也是玻璃層——比外層彈窗再淡一點、模糊再輕一點，
     兩層玻璃疊起來要看得出「這層在那層上面」的層次感，不能糊成同一片 */
  .column {
    display: flex;
    flex-direction: column;
    padding: 24px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .column-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0 0 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(22, 22, 26, 0.16);
  }

  .info-list {
    display: grid;
    gap: 12px;
    margin-bottom: 24px;
  }

  /* 固定寬度兩欄 grid，不是 flex+space-between——原本靠彈性間距把值推到最右邊，
     每一列值的長度不同，中間的分界線就跟著每列跑，看起來對不齊。改成固定欄寬，
     值一律從同一個 x 位置開始往右排（左對齊），六列的分界線落在同一條垂直線上 */
  .info-row {
    display: grid;
    grid-template-columns: 66px 1fr;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-radius: 14px;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.55);
  }

  .info-label {
    font-weight: 600;
    color: rgba(22, 22, 26, 0.6);
    white-space: nowrap;
  }

  /* 信箱要單行顯示，不換行、不截斷——縮窄標籤欄（80→66px）＋分隔線內距（12→8px），
     擠出剛好夠信箱單行塞下的寬度（實測需要 208px，現在可用 212px） */
  .info-value {
    font-weight: 600;
    color: var(--ink);
    text-align: left;
    white-space: nowrap;
    padding-left: 8px;
    border-left: 1px solid rgba(22, 22, 26, 0.12);
  }

  .logout-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    margin: 0 auto;
    padding: 12px 40px;
    border: none;
    border-radius: 14px;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  .hud-wrap {
    flex: 1;
    display: grid;
    align-content: center;
  }

  .hud-card {
    padding: 20px 16px 16px;
    border-radius: 16px;
    text-align: center;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .hud-icon {
    width: 26px;
    height: 26px;
    color: rgba(22, 22, 26, 0.55);
    margin: 0 auto 8px;
    display: block;
  }

  .hud-num {
    font-variant-numeric: tabular-nums;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(22, 22, 26, 0.16);
  }

  .hud-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--ink);
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .month-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: rgba(22, 22, 26, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .month-label {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    min-width: 88px;
    text-align: center;
  }

  .history-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: rgba(22, 22, 26, 0.5);
    padding: 24px 0;
  }

  .history-empty svg { opacity: 0.6; }

  .note {
    max-width: 640px;
    margin: 28px auto 0;
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    color: rgba(22, 22, 26, 0.55);
  }

  .note code {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    background: rgba(22, 22, 26, 0.08);
    padding: 2px 6px;
    border-radius: 5px;
    color: rgba(22, 22, 26, 0.8);
  }
</style>
